# n8n configurado como o fluxo exige: pasta /files montada, módulo fs e @e965/xlsx liberados nos nós Code.
# Uso: copie .env.example para .env, ajuste PASTA_ARQUIVOS e rode `docker compose up -d`.
services:
  n8n:
    image: n8nio/n8n:latest   # validado na versão 2.39.6
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - TZ=${TIMEZONE:-America/Sao_Paulo}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      # Os nós Code só podem ler/gravar dentro de /files.
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # fs: leitura do CSV de filtros/modelo e gravação dos editais baixados.
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      # @e965/xlsx: preenche o modelo Excel preservando a formatação (já vem com o n8n).
      - NODE_FUNCTION_ALLOW_EXTERNAL=@e965/xlsx
      # Se a versão do n8n mudar, confira o caminho com:
      #   docker exec n8n sh -c "ls -d /usr/local/lib/node_modules/n8n/node_modules/.pnpm/@e965+xlsx@*"
      - NODE_PATH=/usr/local/lib/node_modules:/usr/local/lib/node_modules/n8n/node_modules/.pnpm/@e965+xlsx@0.20.3/node_modules
    volumes:
      - n8n_data:/home/node/.n8n
      # Pasta do host que contém PREGÕES_2026/ (no ambiente original: a Área de Trabalho).
      - ${PASTA_ARQUIVOS}:/files

volumes:
  n8n_data:
